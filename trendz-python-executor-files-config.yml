apiVersion: v1
kind: ConfigMap
metadata:
  name: trendz-python-executor-files-config
  namespace: trendz
  labels:
    name: trendz-python-executor-files-config-label
data:
  requirements.txt: |
    # Mounted by trendz-python-executor-files-config
    pandas==2.0.3
    numpy==1.24.3
    scikit-learn==1.3.0
    matplotlib==3.7.2
    seaborn==0.12.2
    requests==2.31.0
    pytz==2023.3
    plotly==5.15.0
    statsmodels==0.14.0
    scipy==1.11.1
    joblib==1.3.2

  python-executor.conf: |
    # Mounted by trendz-python-executor-files-config
    export LOG_FILENAME=python-executor.out
    export LOADER_PATH=/usr/share/python-executor/conf
    
    export JAVA_OPTS="$JAVA_OPTS -Dplatform=deb"
    export JAVA_OPTS="$JAVA_OPTS -XX:+IgnoreUnrecognizedVMOptions"
    
    export JAVA_OPTS="$JAVA_OPTS -XX:MaxMetaspaceSize=128m"
    export JAVA_OPTS="$JAVA_OPTS -XX:MaxDirectMemorySize=128m"
    export JAVA_OPTS="$JAVA_OPTS -XX:+HeapDumpOnOutOfMemoryError"
    export JAVA_OPTS="$JAVA_OPTS -XX:+ExitOnOutOfMemoryError"
    export JAVA_OPTS="$JAVA_OPTS -XX:+AlwaysPreTouch"
    export JAVA_OPTS="$JAVA_OPTS -XX:HeapDumpPath=/home/python-executor/heap-dumps/${TB_SERVICE_ID}-heapdump.bin"

  logback.xml: |
    <?xml version="1.0" encoding="UTF-8" ?>
    <!-- Mounted by trendz-python-executor-files-config -->
    
    <!DOCTYPE configuration>
    <configuration scan="true" scanPeriod="10 seconds">
        
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{ISO8601} [%thread] %-5level %logger{36} - %msg%replace( trace=%X{traceId:-}){' trace=$', ''}%n</pattern>
            </encoder>
        </appender>
            
        <logger name="org.springframework.web.socket" level="INFO" />
        <logger name="org.thingsboard.trendz.pythonexecutor" level="INFO" />
        <logger name="org.thingsboard.trendz.pythonexecutor.service.engine.PythonScriptEngine" level="INFO" />
        
        <root level="INFO">
            <appender-ref ref="STDOUT"/>
        </root>
        
    </configuration>
---
