# Connection to the Trendz database (PostgreSQL). Put the real values here before applying, or create the Secret
# from the command line and skip this file:
#   kubectl -n trendz create secret generic trendz-db-app-secret \
#     --from-literal=SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/trendz \
#     --from-literal=SPRING_DATASOURCE_USERNAME=<user> --from-literal=SPRING_DATASOURCE_PASSWORD=<password>
apiVersion: v1
kind: Secret
metadata:
  name: trendz-db-app-secret
  namespace: trendz
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://trendz-db-service:5432/trendz
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
---
