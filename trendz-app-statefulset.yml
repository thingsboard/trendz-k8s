# A StatefulSet, not a Deployment: with a legacy license (TRENDZ_LICENSE_SECRET) every Trendz replica is a separate
# instance on the license server and keeps its own instance file (TRENDZ_LICENSE_INSTANCE_DATA_FILE below). The file
# carries a token the license server replaces on every check, so replicas sharing one file overwrite each other's
# token and fail the check. A StatefulSet gives the pods stable names (trendz-app-0, trendz-app-1, ...), and so a
# stable file per pod across restarts; a Deployment's random pod names would activate a new instance on every restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trendz-app
  namespace: trendz
  labels:
    app: trendz-app-statefulset-label
spec:
  serviceName: trendz-app-headless-service
  selector:
    matchLabels:
      app: trendz-app-pod-label
  # Scale by raising this: the replicas share Valkey (trendz-cache-deployment.yml) and a ReadWriteMany volume
  # (trendz-app-shared-pvc.yml). Keep one executor per Trendz replica (trendz-python-executor-deployment.yml)
  replicas: 1
  # replicas start and stop together, not one after another
  podManagementPolicy: Parallel
  # a rollout replaces the pods one at a time, keeping each pod's name: with one replica Trendz is down while its
  # pod restarts; with two or more the others keep serving
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: trendz-app-pod
      labels:
        app: trendz-app-pod-label
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/actuator/prometheus'
        prometheus.io/port: '8888'
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 799
        runAsNonRoot: true
        fsGroup: 799
        runAsGroup: 799
        seccompProfile:
          type: RuntimeDefault
      # Spread the replicas over the nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: trendz-app-pod-label
#      affinity:
#        nodeAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#            nodeSelectorTerms:
#              - matchExpressions:
#                  - key: trendz-node-type
#                    operator: In
#                    values:
#                      - working-node
      containers:
        - name: trendz-app-container
          image: thingsboard/trendz:1.16.1.3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu:    "1600m"
              memory: "3500M"
            requests:
              cpu:    "1600m"
              memory: "3500M"
          ports:
            - name: app-api-pod
              protocol: TCP
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: trendz-app-env-config
          env:
            - name: TB_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TB_API_URL
              value: "http://thingsboard-app:8080"
            - name: TRENDZ_LICENSE_SECRET # Only for legacy subscriptions / licenses
              value: "PUT_LICENSE_HERE"
            # One file per pod on the shared volume, named after the pod (TB_SERVICE_ID above; Kubernetes expands
            # $(...) from variables listed earlier). A flat name: the license client creates the file, not a folder
            - name: TRENDZ_LICENSE_INSTANCE_DATA_FILE
              value: "/data/license-$(TB_SERVICE_ID).data"
            - name: JWT_TOKEN_SIGNING_KEY # Only for ThingsBoard older than v4.3.0
              value: "thingsboardDefaultSigningKey"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trendz-db-app-secret
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trendz-db-app-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trendz-db-app-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: PYTHON_EXECUTOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: trendz-python-executor-secret
                  key: PYTHON_EXECUTOR_SECRET
          readinessProbe:
            httpGet:
              path: /trendz/actuator
              port: 8888
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /trendz/actuator
              port: 8888
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /trendz/actuator
              port: 8888
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 10
          volumeMounts:
            - name: trendz-app-files-config
              mountPath: /trendz-config-files
            - name: trendz-app-logs
              mountPath: /var/log/trendz
            - name: trendz-app-shared
              mountPath: /data
      volumes:
        - name: trendz-app-files-config
          configMap:
            name: trendz-app-files-config
            items:
              - key: trendz.conf
                path: trendz.conf
              - key: logback.xml
                path: logback.xml
        - name: trendz-app-logs
          emptyDir: { }
        - name: trendz-app-shared
          persistentVolumeClaim:
            claimName: trendz-app-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: trendz-app-service
  namespace: trendz
spec:
  type: ClusterIP
  selector:
    app: trendz-app-pod-label
  ports:
    - name: app-api-service
      protocol: TCP
      port: 8888
      targetPort: app-api-pod
---
# Governing service of the StatefulSet (serviceName above); clients use trendz-app-service
apiVersion: v1
kind: Service
metadata:
  name: trendz-app-headless-service
  namespace: trendz
spec:
  clusterIP: None
  selector:
    app: trendz-app-pod-label
  ports:
    - name: app-api-service
      protocol: TCP
      port: 8888
      targetPort: app-api-pod
---
